# NEPSE Top Turnover analysis on a server: the app only. MySQL is an existing server (managed database or another
# droplet on the VPC). Settings and the database password live in .env next to this file (copy .env.example).
#
# The app has no login, so by default it listens on 127.0.0.1 only: put nginx (HTTPS + basic auth) in front of it.
# Set APP_BIND=0.0.0.0 in .env only if you accept that anyone who finds the address can use it.
#
# From the repository root:
#   cp .env.example .env    # then edit it
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nepse-topturnover
    restart: unless-stopped

    environment:
      SERVER_PORT: "${APP_PORT:-8083}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://10.122.0.4:3306/nepbrain_nepse_analysis?useTimezone=true&serverTimezone=Asia/Kathmandu"
      SPRING_DATASOURCE_USERNAME: "nepbrain"
      SPRING_DATASOURCE_PASSWORD: "Nepbrain@10"

      # Daily price crawl and floorsheet collection (both on by default).
      NEPSE_CRAWL_ENABLED: "${CRAWL_ENABLED:-true}"
      NEPSE_FLOORSHEET_ENABLED: "${FLOORSHEET_ENABLED:-true}"

      # nginx in front: trust X-Forwarded-* for https redirects and client IPs.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TZ: Asia/Kathmandu
      JAVA_TOOL_OPTIONS: >-
        -Xms${JVM_XMS:-256m}
        -Xmx${JVM_XMX:-1024m}
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError

    volumes:
      # Edit holidays on the server without rebuilding.
      - ./config/holidays.txt:/app/config/holidays.txt:ro
      - app-logs:/app/logs

    ports:
      - "8083:8083"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  app-logs:
