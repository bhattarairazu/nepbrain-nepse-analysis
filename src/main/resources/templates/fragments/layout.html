<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · NEPSE Top Turnover'">NEPSE Top Turnover</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="logo" aria-hidden="true">▲</span>
        <span><b>NEPSE Top Turnover</b><small>Top 20 turnover &amp; volume analysis</small></span>
    </a>
    <nav>
        <a th:href="@{/}" th:classappend="${active == 'day'} ? 'on'">Daily lists</a>
        <a th:href="@{/money-flow}" th:classappend="${active == 'flow'} ? 'on'">Money flow</a>
        <a th:href="@{/market}" th:classappend="${active == 'market'} ? 'on'">Market activity</a>
        <a th:href="@{/crawl}" th:classappend="${active == 'crawl'} ? 'on'">Data &amp; crawler</a>
    </nav>
</header>

<footer th:fragment="footer" class="footer">
    Data: ShareSansar "Today's Share Price", collected once per trading day after the close, for personal analysis.
    Not investment advice.
</footer>

</body>
</html>
